name: Release Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # Trigger the workflow when resources are modified
      - "infra/resources/**"

jobs:
  release_dev:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@e08d8ce496df31036c9b04f42178c04947415cfc # main
    name: Release Infrastructure
    secrets: inherit
    with:
      environment: dev
      base_path: infra/resources
